[mod]
id = "hud_plus"
version = "5"
priority = 100

# The Nightly this build targets: it already contains the focus fix (#7455)
# and the middle-click world selection (#7473).
[compatibility]
horizon_revision = "f42ef42ef6ceccb3c6a20bea2481d87949a51c81"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "official_hud_plus"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "official_hud_plus_glue"
source = "glue.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

